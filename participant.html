<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participant Experiment Suite</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS -->
  <link rel="stylesheet" href="styles.css?v=24">
  <!-- sql.js (SQLite WASM) library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Participant Restricted Navbar -->
    <header class="app-header" style="justify-content: space-between; padding: 6px 16px;">
      <div class="brand" style="gap: 8px; display: flex; align-items: center;">
        <div class="logo-icon" style="width: 30px; height: 30px; font-size: 15px;" title="Participant Workspace"><i class="fa-solid fa-keyboard"></i></div>
        <span class="badge" id="app-version-tag" style="font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.1); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;">v1.0.15</span>
      </div>
      <div class="header-actions" style="display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; white-space: nowrap;">
        <!-- Participant ID & Questions Answered Counter Pill -->
        <div class="seed-control d-flex align-center gap-1" style="background: rgba(56, 189, 248, 0.12); border: 1.5px solid rgba(56, 189, 248, 0.4); padding: 4px 10px; border-radius: 6px; white-space: nowrap; box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);">
          <label for="participant-id-input" style="font-size: 12px; margin: 0; white-space: nowrap; color: #38bdf8; font-weight: 700;">
            <i class="fa-solid fa-id-badge" style="color: #38bdf8; font-size: 13px;"></i> User ID:
          </label>
          <input type="text" id="participant-id-input" placeholder="User ID" readonly title="Click to copy User ID to clipboard" style="width: 110px; color: #38bdf8; font-weight: 800; font-family: monospace; font-size: 13px; padding: 2px 6px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 4px; cursor: pointer; text-align: center; letter-spacing: 0.5px;">
          <button id="btn-copy-user-id" class="btn btn-sm" title="Copy User ID to Clipboard" style="font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(56, 189, 248, 0.25); border: 1px solid rgba(56, 189, 248, 0.6); color: #38bdf8; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; margin-left: 2px;">
            <i class="fa-solid fa-copy"></i> <span id="copy-btn-text">Copy</span>
          </button>
          <span style="color: rgba(255,255,255,0.25); margin: 0 4px;">|</span>
          <span style="font-size: 11px; color: var(--text-main); font-weight: 600; white-space: nowrap;">
            <i class="fa-solid fa-list-check text-primary"></i> Answered: <strong id="nav-questions-counter" style="color: var(--color-primary); font-size: 12px; margin-left: 2px;">0 / 60</strong>
          </span>
        </div>

        <!-- Dev Reset Test Button (Toggled via ENABLE_DEV_RESET flag) -->
        <button id="btn-reset-test" class="btn btn-sm" title="Reset test progress and start at Question 1" style="font-size: 11px; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.15); color: #f87171; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
          <i class="fa-solid fa-rotate-left"></i> Reset Test
        </button>
      </div>
    </header>

    <!-- Full Width Workspace Layout for Participants -->
    <main class="main-layout" style="grid-template-columns: 1fr; max-width: 1300px; margin: 0 auto; width: 100%; padding: 10px 16px;">
      <section class="workspace-panel p-0" style="padding: 0;">
        <!-- Restricted Active Tab Container -->
        <div id="tab-human" class="tab-content active">
          <div id="human-challenge-container">
            <!-- Dynamically rendered Participant Challenge Card -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- JS Module Scripts -->
  <script src="js/config.js?v=21"></script>
  <script src="js/schemaGenerator.js?v=20"></script>
  <script src="js/queryGenerator.js?v=20"></script>
  <script src="js/syntaxDialects.js?v=20"></script>
  <script src="js/quizGenerator.js?v=21"></script>
  <script src="js/participantAnalytics.js?v=21"></script>
  <script src="js/engines/sqliteEngine.js?v=20"></script>
  <script src="js/engines/customJsEngine.js?v=20"></script>
  <script src="js/engines/optimizerEngine.js?v=20"></script>
  <script src="js/humanResolver.js?v=31"></script>
  <script src="js/app.js?v=21"></script>
</body>
</html>
