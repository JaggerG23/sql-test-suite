<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participant Experiment Suite</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS -->
  <link rel="stylesheet" href="styles.css?v=26">
  <!-- sql.js (SQLite WASM) library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Participant Restricted Navbar -->
    <header class="app-header" style="justify-content: flex-end; padding: 4px 16px;">
      <div class="header-actions" style="display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; white-space: nowrap;">
        <!-- Questions Answered Counter Pill -->
        <div class="counter-pill d-flex align-center gap-1" style="background: rgba(99, 102, 241, 0.12); border: 1.5px solid rgba(99, 102, 241, 0.4); padding: 5px 12px; border-radius: 6px; white-space: nowrap; box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);">
          <span style="font-size: 11.5px; color: var(--text-main); font-weight: 600; white-space: nowrap;">
            <i class="fa-solid fa-list-check text-primary"></i> Answered: <strong id="nav-questions-counter" style="color: var(--color-primary); font-size: 12px; margin-left: 2px;">0 / 60</strong>
          </span>
        </div>

        <!-- Dev Reset Test Button (Toggled via ENABLE_DEV_RESET flag) -->
        <button id="btn-reset-test" class="btn btn-sm" title="Reset test progress and start at Question 1" style="font-size: 11px; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.15); color: #f87171; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
          <i class="fa-solid fa-rotate-left"></i> Reset Test
        </button>
      </div>
    </header>

    <!-- Full Width Workspace Layout for Participants -->
    <main class="main-layout" style="grid-template-columns: 1fr; max-width: min(1600px, 98vw); margin: 0 auto; width: 100%; padding: 6px 16px;">
      <section class="workspace-panel p-0" style="padding: 0;">
        <!-- Restricted Active Tab Container -->
        <div id="tab-human" class="tab-content active">
          <div id="human-challenge-container">
            <!-- Dynamically rendered Participant Challenge Card -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- JS Module Scripts -->
  <script src="js/config.js?v=22"></script>
  <script src="js/schemaGenerator.js?v=21"></script>
  <script src="js/queryGenerator.js?v=21"></script>
  <script src="js/syntaxDialects.js?v=21"></script>
  <script src="js/quizGenerator.js?v=22"></script>
  <script src="js/participantAnalytics.js?v=24"></script>
  <script src="js/engines/sqliteEngine.js?v=21"></script>
  <script src="js/engines/customJsEngine.js?v=21"></script>
  <script src="js/engines/optimizerEngine.js?v=21"></script>
  <script src="js/humanResolver.js?v=47"></script>
  <script src="js/app.js?v=29"></script>
</body>
</html>
