<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Matrix - Participant Experiment Workspace</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
  <!-- sql.js (SQLite WASM) library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Participant Restricted Navbar -->
    <header class="app-header" style="justify-content: space-between; padding: 8px 20px;">
      <div class="brand">
        <div class="logo-icon" style="width: 32px; height: 32px; font-size: 15px;"><i class="fa-solid fa-keyboard"></i></div>
        <div class="brand-text">
          <h1 style="font-size: 17px;">SQL Matrix</h1>
          <span class="badge badge-accent" style="font-size: 10px;">Participant Experiment Workspace</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- Participant ID & Questions Answered Counter Pill -->
        <div class="seed-control d-flex align-center gap-2" style="background: rgba(99, 102, 241, 0.15); border-color: rgba(99, 102, 241, 0.35); padding: 4px 12px; border-radius: 6px;">
          <label for="participant-id-input" style="font-size: 12px; margin: 0;"><i class="fa-solid fa-user-tag text-primary"></i> Participant ID:</label>
          <input type="text" id="participant-id-input" placeholder="User ID" style="width: 85px; color: var(--color-primary); font-weight: 700; font-size: 13px;">
          <span style="color: rgba(255,255,255,0.25); margin: 0 4px;">|</span>
          <span style="font-size: 12px; color: var(--text-main); font-weight: 600;">
            <i class="fa-solid fa-list-check text-primary"></i> Questions Answered: <strong id="nav-questions-counter" style="color: var(--color-primary); font-size: 13px; margin-left: 2px;">0 / 60</strong>
          </span>
        </div>
      </div>
    </header>

    <!-- Full Width Workspace Layout for Participants -->
    <main class="main-layout" style="grid-template-columns: 1fr; max-width: 1300px; margin: 0 auto; width: 100%; padding: 10px 16px;">
      <section class="workspace-panel p-0" style="padding: 0;">
        <!-- Restricted Active Tab Container -->
        <div id="tab-human" class="tab-content active">
          <div id="human-challenge-container">
            <!-- Dynamically rendered Participant Challenge Card -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- JS Module Scripts -->
  <script src="js/schemaGenerator.js?v=9"></script>
  <script src="js/queryGenerator.js?v=9"></script>
  <script src="js/syntaxDialects.js?v=9"></script>
  <script src="js/quizGenerator.js?v=9"></script>
  <script src="js/participantAnalytics.js?v=9"></script>
  <script src="js/engines/sqliteEngine.js?v=9"></script>
  <script src="js/engines/customJsEngine.js?v=9"></script>
  <script src="js/engines/optimizerEngine.js?v=9"></script>
  <script src="js/humanResolver.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
