services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_study_postgres
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    command: postgres -c shared_buffers=32MB -c work_mem=2MB -c max_connections=25
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sqlstudy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqlstudy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sql_study}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sqlstudy} -d ${POSTGRES_DB:-sql_study}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
