# Sample Nginx configuration for AWS Lightsail
# Place in /etc/nginx/sites-available/sql-study and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;

    root /home/ubuntu/sql-randomized-test-suite;
    index participant.html index.html;

    # Block direct downloads of sensitive data & server files
    location ~* (extra_credit_emails\.(csv|txt)|telemetry_events\.jsonl|participant_responses_db\.json|participant_responses_export\.csv|group_rotation\.json|study_config\.json|nginx_debug\.txt|server\.py|patch_nginx\.py|sql-study\.service|\.env|\.git) {
        deny all;
        return 404;
    }

    # Admin Dashboard shortcut route
    location = /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    location = /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    # Static Assets & Pages
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /participant.html;
    }

    # Reverse Proxy API telemetry endpoints to Python server.py
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
