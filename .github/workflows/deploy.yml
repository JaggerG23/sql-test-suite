name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Lightsail and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            cd ~/sql-test-suite
            git pull origin master
            
            # Sync files to the web root, delete old files, and ignore the .git folder and database files
            sudo rsync -av --delete --exclude='.git/' --exclude='participant_responses_db.json' --exclude='participant_responses_export.csv' ~/sql-test-suite/ /var/www/html/
            
            # Restart the python telemetry server so the newly deployed code actually runs
            # (Replace 'sql-study' with your actual service name if it's different)
            sudo systemctl restart sql-study || sudo pkill -f "python.*server.py"
