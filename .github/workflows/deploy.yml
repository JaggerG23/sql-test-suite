name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Lightsail and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script_stop: true
          script: |
            set -e

            # Resolve repository directory on Lightsail
            if [ -d "$HOME/sql-test-suite/.git" ]; then
              REPO_DIR="$HOME/sql-test-suite"
            elif [ -d "$HOME/sql-randomized-test-suite/.git" ]; then
              REPO_DIR="$HOME/sql-randomized-test-suite"
            else
              REPO_DIR=$(find "$HOME" -maxdepth 2 -name ".git" -exec dirname {} \; | head -n 1)
            fi

            echo "Target repository directory: $REPO_DIR"
            cd "$REPO_DIR"

            # Preserve existing server telemetry data if present in repo dir
            mkdir -p "$HOME/sql_telemetry_backup"
            [ -f "$REPO_DIR/participant_responses_db.json" ] && cp "$REPO_DIR/participant_responses_db.json" "$HOME/sql_telemetry_backup/" || true
            [ -f "$REPO_DIR/participant_responses_export.csv" ] && cp "$REPO_DIR/participant_responses_export.csv" "$HOME/sql_telemetry_backup/" || true
            [ -f "$REPO_DIR/telemetry_events.jsonl" ] && cp "$REPO_DIR/telemetry_events.jsonl" "$HOME/sql_telemetry_backup/" || true
            [ -f "$REPO_DIR/extra_credit_emails.csv" ] && cp "$REPO_DIR/extra_credit_emails.csv" "$HOME/sql_telemetry_backup/" || true
            [ -f "$REPO_DIR/extra_credit_emails.txt" ] && cp "$REPO_DIR/extra_credit_emails.txt" "$HOME/sql_telemetry_backup/" || true

            # Forcefully fetch and reset to latest origin/master to eliminate merge conflicts on tracked files
            git fetch origin master
            git reset --hard origin/master

            # Restore telemetry data files so participant data is never lost
            [ -f "$HOME/sql_telemetry_backup/participant_responses_db.json" ] && cp "$HOME/sql_telemetry_backup/participant_responses_db.json" "$REPO_DIR/" || true
            [ -f "$HOME/sql_telemetry_backup/participant_responses_export.csv" ] && cp "$HOME/sql_telemetry_backup/participant_responses_export.csv" "$REPO_DIR/" || true
            [ -f "$HOME/sql_telemetry_backup/telemetry_events.jsonl" ] && cp "$HOME/sql_telemetry_backup/telemetry_events.jsonl" "$REPO_DIR/" || true
            [ -f "$HOME/sql_telemetry_backup/extra_credit_emails.csv" ] && cp "$HOME/sql_telemetry_backup/extra_credit_emails.csv" "$REPO_DIR/" || true
            [ -f "$HOME/sql_telemetry_backup/extra_credit_emails.txt" ] && cp "$HOME/sql_telemetry_backup/extra_credit_emails.txt" "$REPO_DIR/" || true

            # Sync updated files to Nginx web root (/var/www/html/)
            sudo rsync -av --delete --exclude='.git/' --exclude='participant_responses_db.json' --exclude='participant_responses_export.csv' --exclude='telemetry_events.jsonl' --exclude='extra_credit_emails.csv' --exclude='extra_credit_emails.txt' "$REPO_DIR/" /var/www/html/

            # Run patch_nginx.py
            if [ -f "$REPO_DIR/patch_nginx.py" ]; then
              sudo python3 "$REPO_DIR/patch_nginx.py"
            fi

            # Record latest deployed git commit in web root for verification
            git log -1 --format="Deployed Commit: %h - %s (%cd)" > /tmp/deploy_commit.txt
            sudo mv /tmp/deploy_commit.txt /var/www/html/deploy_commit.txt

            # Dump Nginx info for debugging
            sudo ls -la /etc/nginx/sites-available/ > /var/www/html/nginx_debug.txt
            sudo ls -la /etc/nginx/conf.d/ >> /var/www/html/nginx_debug.txt
            sudo cat /etc/nginx/sites-available/default >> /var/www/html/nginx_debug.txt 2>/dev/null

            # Reload systemd and restart service
            sudo systemctl daemon-reload
            sudo systemctl restart sql-study
