name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Lightsail and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            cd ~/sql-test-suite
            git pull origin master
            
            # Sync files to web root
            sudo rsync -av --delete --exclude='.git/' --exclude='participant_responses_db.json' --exclude='participant_responses_export.csv' --exclude='telemetry_events.jsonl' ~/sql-test-suite/ /var/www/html/
            
            # Run patch script
            sudo python3 ~/sql-test-suite/patch_nginx.py
            
            # Dump Nginx info for debugging
            sudo ls -la /etc/nginx/sites-available/ > /var/www/html/nginx_debug.txt
            sudo ls -la /etc/nginx/conf.d/ >> /var/www/html/nginx_debug.txt
            sudo cat /etc/nginx/sites-available/default >> /var/www/html/nginx_debug.txt 2>/dev/null
            sudo cat /etc/nginx/sites-enabled/default >> /var/www/html/nginx_debug.txt 2>/dev/null
            
            # Stop existing processes
            sudo systemctl stop sql-study 2>/dev/null || true
            sudo systemctl disable sql-study 2>/dev/null || true
            sudo pkill -f "python.*server.py" || true
            sleep 2
            
            # Launch detached process safely via bash subshell
            cd /var/www/html
            sudo bash -c "nohup python3 server.py </dev/null> /var/www/html/server_error.txt 2>&1 &"
            
            # Force the SSH action to close cleanly
            exit 0
