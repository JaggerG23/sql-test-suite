name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Lightsail and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            cd ~/sql-test-suite
            git pull origin master
            
            # Sync files to the web root, delete old files, and ignore the .git folder
            sudo rsync -av --delete --exclude='.git/' ~/sql-test-suite/ /var/www/html/
