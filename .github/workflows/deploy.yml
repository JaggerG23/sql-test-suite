name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Lightsail and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            cd ~/sql-test-suite
            git pull origin master
            
            # Sync files to the web root, delete old files, and ignore the .git folder and database files
            sudo rsync -av --delete --exclude='.git/' --exclude='participant_responses_db.json' --exclude='participant_responses_export.csv' --exclude='telemetry_events.jsonl' ~/sql-test-suite/ /var/www/html/
            
            # Ensure Nginx proxies /api/ requests to the Python telemetry server on port 8000
            # Only inject the proxy block if it doesn't already exist (preserves SSL/Certbot config)
            if ! grep -q 'location /api/' /etc/nginx/sites-available/default 2>/dev/null; then
              sudo sed -i '/location \/ {/i \    location /api/ {\n        proxy_pass http://127.0.0.1:8000;\n        proxy_set_header Host \$host;\n        proxy_set_header X-Real-IP \$remote_addr;\n        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto \$scheme;\n        proxy_read_timeout 30s;\n    }\n' /etc/nginx/sites-available/default
              sudo nginx -t && sudo systemctl reload nginx
            fi
            
            # Restart the python telemetry server so the newly deployed code actually runs
            sudo systemctl restart sql-study || sudo pkill -f "python.*server.py"
