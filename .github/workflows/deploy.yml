name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Lightsail and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            # Resolve repository directory on Lightsail
            if [ -d "$HOME/sql-test-suite/.git" ]; then
              REPO_DIR="$HOME/sql-test-suite"
            elif [ -d "$HOME/sql-randomized-test-suite/.git" ]; then
              REPO_DIR="$HOME/sql-randomized-test-suite"
            else
              REPO_DIR=$(find "$HOME" -maxdepth 2 -name ".git" -exec dirname {} \; | head -n 1)
            fi

            echo "Target repository directory: $REPO_DIR"
            cd "$REPO_DIR"

            # Forcefully fetch and reset to latest origin/master
            git fetch origin master
            git reset --hard origin/master

            # Remove obsolete local JSON/JSONL/CSV files and backup folder from Lightsail
            rm -rf "$HOME/sql_telemetry_backup" \
              "$REPO_DIR/scratch" \
              "$REPO_DIR/__pycache__" \
              "$REPO_DIR/telemetry_events.jsonl" \
              "$REPO_DIR/participant_responses_db.json" \
              "$REPO_DIR/participant_responses_export.csv" \
              "$REPO_DIR/extra_credit_emails.csv" \
              "$REPO_DIR/extra_credit_emails.txt" \
              "$REPO_DIR/group_rotation.json" \
              "$REPO_DIR/study_config.json" \
              "$REPO_DIR/google_apps_script.js" \
              "$REPO_DIR/nginx.conf"

            # Ensure container config files are world-readable for non-root container UIDs (pgadmin UID 5050, postgres UID 70)
            chmod -R a+rX "$REPO_DIR/db" "$REPO_DIR/pgadmin"

            # Ensure python3-psycopg2 and Docker are installed on the Lightsail host
            if ! python3 -c "import psycopg2" >/dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-psycopg2
            fi

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
              sudo usermod -aG docker "$USER" || true
            fi

            # Pull images quietly (avoids flooding SSH stderr with layer extraction progress) and start containers
            sudo docker compose pull --quiet
            sudo docker compose up -d

            # Wait until PostgreSQL is ready to accept connections before restarting server.py
            echo "Waiting for PostgreSQL container to become ready..."
            for i in $(seq 1 30); do
              if sudo docker exec sql_study_postgres pg_isready -U sqlstudy -d sql_study >/dev/null 2>&1; then
                echo "PostgreSQL is ready."
                break
              fi
              sleep 1
            done

            # Sync updated static web files to Nginx web root (/var/www/html/), excluding backend/Docker files
            sudo rsync -av --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.gitignore' \
              --exclude='.env' \
              --exclude='.env.example' \
              --exclude='db/' \
              --exclude='pgadmin/' \
              --exclude='docker-compose.yml' \
              --exclude='DOCKER.md' \
              --exclude='STUDY_QUESTIONS_REFERENCE.md' \
              --exclude='server.py' \
              --exclude='patch_nginx.py' \
              --exclude='build_bundle.js' \
              --exclude='sql-study.service' \
              --exclude='nginx_lightsail.conf' \
              "$REPO_DIR/" /var/www/html/

            # Remove any legacy public debug dumps
            sudo rm -f /var/www/html/nginx_debug.txt

            # Run patch_nginx.py to configure /api/ and /pgadmin/ reverse proxies
            if [ -f "$REPO_DIR/patch_nginx.py" ]; then
              sudo python3 "$REPO_DIR/patch_nginx.py"
            fi

            # Record latest deployed git commit in web root for verification
            git log -1 --format="Deployed Commit: %h - %s (%cd)" > /tmp/deploy_commit.txt
            sudo mv /tmp/deploy_commit.txt /var/www/html/deploy_commit.txt

            # Reload systemd and restart service
            sudo systemctl daemon-reload
            sudo systemctl restart sql-study
